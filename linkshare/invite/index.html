<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リンクシェア - グループに招待</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0b0e;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    text-align: center;
  }
  .card { padding: 32px; max-width: 320px; }
  .emoji { font-size: 48px; }
  h1 { font-size: 18px; margin: 16px 0 8px; }
  p { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; }
  a.button {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 28px;
    border-radius: 14px;
    background: linear-gradient(135deg, #6b5cff, #ff6187);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🔗</div>
    <h1>リンクシェアに招待されました</h1>
    <p id="status">アプリを開いています…</p>
    <a class="button" id="storeLink" href="https://apps.apple.com/jp/search?term=%E3%83%AA%E3%83%B3%E3%82%AF%E3%82%B7%E3%82%A7%E3%82%A2%20-%20%E5%8F%8B%E9%81%94%E3%81%A8%E5%8B%95%E7%94%BB%E3%82%92%E3%82%B7%E3%82%A7%E3%82%A2">
      App Storeで開く
    </a>
  </div>
  <script>
    // TODO: App Store Connectでアプリを新規登録したら発行される数値IDに差し替える
    // 例: https://apps.apple.com/jp/app/id0000000000
    var APP_STORE_URL = "https://apps.apple.com/jp/search?term=%E3%83%AA%E3%83%B3%E3%82%AF%E3%82%B7%E3%82%A7%E3%82%A2%20-%20%E5%8F%8B%E9%81%94%E3%81%A8%E5%8B%95%E7%94%BB%E3%82%92%E3%82%B7%E3%82%A7%E3%82%A2";
    document.getElementById("storeLink").href = APP_STORE_URL;

    var params = new URLSearchParams(window.location.search);
    var groupId = params.get("groupId");
    var scheme = groupId
      ? "linkshare://join?groupId=" + encodeURIComponent(groupId)
      : "linkshare://open";

    // アプリがインストール済みでUniversal Linksが効いていれば、
    // 通常このページ自体に到達せずアプリが直接開く。
    // ここに来た = 未インストール、またはUniversal Links未対応の古いOS。
    window.location.replace(scheme);

    setTimeout(function () {
      document.getElementById("status").textContent =
        "アプリがインストールされていないようです。App Storeへ移動します。";
      window.location.replace(APP_STORE_URL);
    }, 1200);
  </script>
</body>
</html>
